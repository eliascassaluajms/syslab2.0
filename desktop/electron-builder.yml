appId: com.uajms.syslab.lock
productName: SysLab Lock
copyright: UAJMS 2026
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
electronLanguages:
  - en-US
  - es
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: SysLab UAJMS <syslab@uajms.edu.bo>
  synopsis: App de escritorio SysLab 2.0 para el bloqueo y desbloqueo de equipos de laboratorio
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SysLab Lock